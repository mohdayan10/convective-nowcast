[project]
name = "deadlock-nowcast"
version = "0.1.0"
description = "SIH 26084 coverage-aware convective nowcasting (Team Deadlock)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<2.3",
  "scipy>=1.11",
  "pandas>=2.1",
  "h5py>=3.10",
  "fsspec>=2024.2",
  "aiohttp>=3.9",
  "requests>=2.31",
  "xarray>=2024.1",
  "pyproj>=3.6",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
  "scikit-image>=0.22",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "shap>=0.45",
  "pysteps>=1.10",
  "opencv-python-headless>=4.9",
  "pyshp>=2.3",
  "tqdm>=4.66",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = []
